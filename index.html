<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Explore Premodern-legal Magic: The Gathering cards that do not appear on a supplied played-card list."
  />
  <title>Premodern Archives — The Unplayed</title>

  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      padding: 0 16px;
      background: #090909;
    }

    .pm-explorer {
      --pm-bg: #111111;
      --pm-panel: #1b1b1b;
      --pm-panel-light: #222222;
      --pm-border: #363636;
      --pm-border-light: #4a4a4a;
      --pm-text: #ffffff;
      --pm-muted: #9b9b9b;
      --pm-accent: #f3d331;
      --pm-success: #56d364;
      --pm-error: #ff5c5c;

      max-width: 1200px;
      margin: 40px auto;
      padding: 32px;
      background: var(--pm-bg);
      border: 1px solid var(--pm-border);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--pm-text);
      box-sizing: border-box;
    }

    .pm-explorer * {
      box-sizing: border-box;
    }

    .pm-title-frame {
      margin-bottom: 24px;
      padding-bottom: 22px;
      border-bottom: 1px solid var(--pm-border);
    }

    .pm-kicker {
      margin-bottom: 8px;
      color: var(--pm-accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
    }

    .pm-title-frame h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 76px);
      line-height: 0.9;
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .pm-subtitle {
      max-width: 720px;
      margin-top: 14px;
      color: var(--pm-muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .pm-loading {
      margin-bottom: 18px;
      padding: 14px 16px;
      border: 1px solid var(--pm-border);
      background: var(--pm-panel);
      color: var(--pm-muted);
      font-size: 13px;
    }

    .pm-controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 18px;
      background: var(--pm-panel);
      border: 1px solid var(--pm-border);
    }

    .pm-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pm-search-field {
      grid-column: span 2;
    }

    .pm-field label {
      color: #b5b5b5;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
    }

    .pm-field input,
    .pm-field select {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      border: 1px solid var(--pm-border);
      border-radius: 0;
      outline: none;
      background: #141414;
      color: var(--pm-text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    .pm-field input::placeholder {
      color: #666666;
    }

    .pm-field input:focus,
    .pm-field select:focus {
      border-color: var(--pm-accent);
      box-shadow: 0 0 0 1px var(--pm-accent);
    }

    .pm-field select {
      cursor: pointer;
    }

    .pm-actions {
      display: flex;
      gap: 10px;
      margin: 14px 0;
    }

    .pm-button,
    .pm-load-more {
      min-height: 46px;
      padding: 0 22px;
      border-radius: 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }

    .pm-random {
      border: 0;
      background: var(--pm-accent);
      color: #111111;
    }

    .pm-secondary {
      border: 1px solid var(--pm-border-light);
      background: var(--pm-panel);
      color: #ffffff;
    }

    .pm-button:hover,
    .pm-load-more:hover {
      opacity: 0.85;
    }

    .pm-button:active,
    .pm-load-more:active {
      transform: scale(0.98);
    }

    .pm-count-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 12px 0;
      border-bottom: 1px solid var(--pm-border);
      color: var(--pm-muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.1em;
    }

    .pm-count-bar span {
      color: #ffffff;
    }

    .pm-pool-info {
      color: #777777;
    }

    .pm-results {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
    }

    .pm-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--pm-border);
      background: var(--pm-panel);
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .pm-card:hover {
      border-color: #666666;
      transform: translateY(-2px);
    }

    .pm-card-image {
      display: block;
      width: 100%;
      aspect-ratio: 488 / 680;
      object-fit: cover;
      background: #252525;
      border-bottom: 1px solid var(--pm-border);
    }

    .pm-card-info {
      padding: 14px;
    }

    .pm-card-name {
      margin-bottom: 6px;
      color: #ffffff;
      font-size: 17px;
      line-height: 1.15;
      font-weight: 800;
    }

    .pm-card-type {
      min-height: 28px;
      color: var(--pm-muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .pm-card-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid var(--pm-border);
      color: #777777;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .pm-card-link {
      display: block;
      color: inherit;
      text-decoration: none;
    }

    .pm-card-link:hover .pm-card-name {
      color: var(--pm-accent);
    }

    .pm-card[data-color="W"] { border-top: 3px solid #e7e0c7; }
    .pm-card[data-color="U"] { border-top: 3px solid #4d8fc0; }
    .pm-card[data-color="B"] { border-top: 3px solid #69636e; }
    .pm-card[data-color="R"] { border-top: 3px solid #c65345; }
    .pm-card[data-color="G"] { border-top: 3px solid #4c845d; }
    .pm-card[data-color="MULTI"] { border-top: 3px solid #c0a044; }
    .pm-card[data-color="COLORLESS"] { border-top: 3px solid #8a8a8a; }
    .pm-card[data-color="LAND"] { border-top: 3px solid #8c6f52; }

    .pm-random-area:empty {
      display: none;
    }

    .pm-random-area {
      margin-bottom: 22px;
      padding: 20px;
      border: 1px solid var(--pm-border);
      background: var(--pm-panel);
    }

    .pm-random-title {
      margin-bottom: 16px;
      color: var(--pm-accent);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.16em;
    }

    .pm-random-card {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 24px;
      align-items: center;
    }

    .pm-random-card img {
      display: block;
      width: 100%;
      border: 1px solid var(--pm-border-light);
      background: #222222;
    }

    .pm-random-name {
      margin-bottom: 8px;
      color: #ffffff;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.03em;
    }

    .pm-random-type {
      margin-bottom: 14px;
      color: var(--pm-muted);
      font-size: 14px;
    }

    .pm-random-text {
      max-width: 600px;
      color: #d0d0d0;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .pm-load-more {
      display: block;
      margin: 24px auto 0;
      border: 1px solid var(--pm-border-light);
      background: var(--pm-panel);
      color: #ffffff;
    }

    .pm-empty {
      grid-column: 1 / -1;
      padding: 40px 20px;
      border: 1px solid var(--pm-border);
      background: var(--pm-panel);
      color: var(--pm-muted);
      text-align: center;
      font-size: 14px;
    }

    @media (max-width: 1000px) {
      .pm-results {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .pm-explorer {
        margin: 20px auto;
        padding: 22px;
      }

      .pm-controls {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .pm-results {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .pm-random-card {
        grid-template-columns: 160px 1fr;
      }
    }

    @media (max-width: 520px) {
      body {
        padding: 0 10px;
      }

      .pm-controls {
        grid-template-columns: 1fr;
      }

      .pm-search-field {
        grid-column: span 1;
      }

      .pm-results {
        grid-template-columns: 1fr;
      }

      .pm-actions {
        flex-direction: column;
      }

      .pm-button {
        width: 100%;
      }

      .pm-random-card {
        grid-template-columns: 1fr;
      }

      .pm-random-card img {
        max-width: 260px;
      }
    }
  </style>
</head>

<body>
  <main id="pmExplorer" class="pm-explorer">
    <div class="pm-title-frame">
      <div class="pm-kicker">PREMODERN ARCHIVES</div>
      <h1>THE UNPLAYED</h1>
      <div class="pm-subtitle">
        Explore Premodern-legal cards that do not appear on the supplied played-card list.
      </div>
    </div>

    <div id="pmLoading" class="pm-loading">
      Loading the Premodern card pool...
    </div>

    <div class="pm-controls">
      <div class="pm-field pm-search-field">
        <label for="pmSearch">CARD NAME</label>
        <input id="pmSearch" type="text" placeholder="e.g. Hidden Horror" autocomplete="off" />
      </div>

      <div class="pm-field pm-search-field">
        <label for="pmRulesSearch">CARD TEXT</label>
        <input id="pmRulesSearch" type="text" placeholder="e.g. sacrifice a creature" autocomplete="off" />
      </div>

      <div class="pm-field">
        <label for="pmColor">COLOR</label>
        <select id="pmColor">
          <option value="">All Colors</option>
          <option value="W">White</option>
          <option value="U">Blue</option>
          <option value="B">Black</option>
          <option value="R">Red</option>
          <option value="G">Green</option>
          <option value="MULTI">Multicolor</option>
          <option value="COLORLESS">Colorless</option>
          <option value="LAND">Land</option>
        </select>
      </div>

      <div class="pm-field">
        <label for="pmType">CARD TYPE</label>
        <select id="pmType">
          <option value="">All Types</option>
          <option value="Creature">Creature</option>
          <option value="Instant">Instant</option>
          <option value="Sorcery">Sorcery</option>
          <option value="Enchantment">Enchantment</option>
          <option value="Artifact">Artifact</option>
          <option value="Land">Land</option>
        </select>
      </div>

      <div class="pm-field">
        <label for="pmSet">SET</label>
        <select id="pmSet">
          <option value="">All Sets</option>
        </select>
      </div>

      <div class="pm-field">
        <label for="pmMana">MANA VALUE</label>
        <select id="pmMana">
          <option value="">Any Mana Value</option>
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9+">9+</option>
        </select>
      </div>

      <div class="pm-field">
        <label for="pmRarity">RARITY</label>
        <select id="pmRarity">
          <option value="">All Rarities</option>
          <option value="common">Common</option>
          <option value="uncommon">Uncommon</option>
          <option value="rare">Rare</option>
        </select>
      </div>

      <div class="pm-field">
        <label for="pmSort">SORT BY</label>
        <select id="pmSort">
          <option value="name-asc">Name A–Z</option>
          <option value="name-desc">Name Z–A</option>
          <option value="mv-asc">Mana Value: Low–High</option>
          <option value="mv-desc">Mana Value: High–Low</option>
          <option value="color">Color</option>
          <option value="type">Card Type</option>
          <option value="set">Set</option>
        </select>
      </div>
    </div>

    <div class="pm-actions">
      <button id="pmRandom" class="pm-button pm-random" type="button">✦ RANDOM CARD</button>
      <button id="pmReset" class="pm-button pm-secondary" type="button">RESET FILTERS</button>
    </div>

    <div class="pm-count-bar">
      <div><span id="pmResultCount">0</span> CARDS FOUND</div>
      <div class="pm-pool-info"><span id="pmPoolCount">0</span> AVAILABLE CARDS</div>
    </div>

    <div id="pmRandomArea" class="pm-random-area"></div>
    <div id="pmResults" class="pm-results"></div>

    <button id="pmLoadMore" class="pm-load-more" type="button" style="display:none;">
      SHOW MORE CARDS
    </button>
  </main>

    function normalizeName(value) {
      return value
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[’']/g, "")
        .replace(/[^a-zA-Z0-9]/g, "")
        .toLowerCase();
    }

    function textToSet(text) {
      return new Set(
        text
          .trim()
          .split("\n")
          .map(line => line.trim())
          .filter(Boolean)
          .map(normalizeName)
      );
    }

    const excludedSet = textToSet(EXCLUDED_CARDS);
    const bannedSet = textToSet(BANNED_CARDS);

    let allCards = [];
    let filteredCards = [];
    let visibleCount = 80;
    const pageSize = 80;

    const searchInput = document.getElementById("pmSearch");
    const rulesInput = document.getElementById("pmRulesSearch");
    const colorSelect = document.getElementById("pmColor");
    const typeSelect = document.getElementById("pmType");
    const setSelect = document.getElementById("pmSet");
    const manaSelect = document.getElementById("pmMana");
    const raritySelect = document.getElementById("pmRarity");
    const sortSelect = document.getElementById("pmSort");
    const resultsEl = document.getElementById("pmResults");
    const resultCountEl = document.getElementById("pmResultCount");
    const poolCountEl = document.getElementById("pmPoolCount");
    const randomButton = document.getElementById("pmRandom");
    const resetButton = document.getElementById("pmReset");
    const randomArea = document.getElementById("pmRandomArea");
    const loadingEl = document.getElementById("pmLoading");
    const loadMoreButton = document.getElementById("pmLoadMore");

    LEGAL_SETS.forEach(([code, name]) => {
      const option = document.createElement("option");
      option.value = code;
      option.textContent = name;
      setSelect.appendChild(option);
    });

    async function loadPremodernCards() {
      try {
        loadingEl.textContent = "Loading legal Premodern cards...";

        const setQuery = LEGAL_SETS
          .map(([code]) => `e:${code}`)
          .join(" OR ");

        const query = `game:paper (${setQuery})`;

        let url =
          "https://api.scryfall.com/cards/search" +
          "?unique=prints" +
          "&order=name" +
          "&q=" +
          encodeURIComponent(query);

        const printings = [];

        while (url) {
          const response = await fetch(url, {
            headers: {
              Accept: "application/json"
            }
          });

          if (!response.ok) {
            throw new Error(`Card database returned ${response.status}`);
          }

          const json = await response.json();
          printings.push(...json.data);

          loadingEl.textContent =
            "Loading Premodern archive... " +
            printings.length +
            " printings found";

          url = json.has_more ? json.next_page : null;

          if (url) {
            await sleep(150);
          }
        }

        allCards = aggregateCardPrintings(printings)
          .filter(card => !bannedSet.has(normalizeName(card.name)))
          .filter(card => !excludedSet.has(normalizeName(card.name)));

        allCards.sort((a, b) => a.name.localeCompare(b.name));

        loadingEl.style.display = "none";
        poolCountEl.textContent = allCards.length.toLocaleString();

        applyFilters();
      } catch (error) {
        console.error(error);
        loadingEl.innerHTML = `
          <strong>Unable to load the card database.</strong>
          <br><br>
          ${escapeHTML(error.message)}
        `;
      }
    }

    function aggregateCardPrintings(printings) {
      const map = new Map();

      printings.forEach(card => {
        const key = card.oracle_id || normalizeName(card.name);

        if (!map.has(key)) {
          map.set(key, {
            id: key,
            name: card.name,
            colors: card.colors || [],
            colorIdentity: card.color_identity || [],
            manaValue: card.cmc ?? 0,
            typeLine: card.type_line || "",
            oracleText: card.oracle_text || extractFaceText(card),
            image: getCardImage(card),
            scryfallURI: card.scryfall_uri,
            setCodes: new Set(),
            setNames: new Set(),
            rarities: new Set()
          });
        }

        const stored = map.get(key);

        stored.setCodes.add(card.set);
        stored.setNames.add(card.set_name);
        stored.rarities.add(card.rarity);

        if (!stored.image) {
          stored.image = getCardImage(card);
        }
      });

      return [...map.values()];
    }

    function getCardImage(card) {
      if (card.image_uris && card.image_uris.normal) {
        return card.image_uris.normal;
      }

      if (
        card.card_faces &&
        card.card_faces[0] &&
        card.card_faces[0].image_uris
      ) {
        return card.card_faces[0].image_uris.normal;
      }

      return "";
    }

    function extractFaceText(card) {
      if (!card.card_faces) return "";

      return card.card_faces
        .map(face => face.oracle_text || "")
        .join("\n\n");
    }

    function getColorCategory(card) {
      if (card.typeLine.toLowerCase().includes("land")) {
        return "LAND";
      }

      const colors = card.colors || [];

      if (colors.length === 0) return "COLORLESS";
      if (colors.length > 1) return "MULTI";

      return colors[0];
    }

    function applyFilters() {
      const nameSearch = normalizeSearch(searchInput.value);
      const rulesSearch = normalizeSearch(rulesInput.value);
      const color = colorSelect.value;
      const type = typeSelect.value.toLowerCase();
      const set = setSelect.value;
      const mana = manaSelect.value;
      const rarity = raritySelect.value;

      filteredCards = allCards.filter(card => {
        if (
          nameSearch &&
          !normalizeSearch(card.name).includes(nameSearch)
        ) {
          return false;
        }

        if (
          rulesSearch &&
          !normalizeSearch(card.oracleText).includes(rulesSearch)
        ) {
          return false;
        }

        if (
          color &&
          getColorCategory(card) !== color
        ) {
          return false;
        }

        if (
          type &&
          !card.typeLine.toLowerCase().includes(type)
        ) {
          return false;
        }

        if (
          set &&
          !card.setCodes.has(set)
        ) {
          return false;
        }

        if (mana) {
          if (mana === "9+") {
            if (card.manaValue < 9) return false;
          } else {
            if (card.manaValue !== Number(mana)) return false;
          }
        }

        if (
          rarity &&
          !card.rarities.has(rarity)
        ) {
          return false;
        }

        return true;
      });

      sortCards(filteredCards);
      visibleCount = pageSize;
      renderResults();
    }

    function sortCards(cards) {
      const mode = sortSelect.value;

      const colorOrder = {
        W: 1,
        U: 2,
        B: 3,
        R: 4,
        G: 5,
        MULTI: 6,
        COLORLESS: 7,
        LAND: 8
      };

      cards.sort((a, b) => {
        switch (mode) {
          case "name-desc":
            return b.name.localeCompare(a.name);

          case "mv-asc":
            return (
              a.manaValue - b.manaValue ||
              a.name.localeCompare(b.name)
            );

          case "mv-desc":
            return (
              b.manaValue - a.manaValue ||
              a.name.localeCompare(b.name)
            );

          case "color":
            return (
              colorOrder[getColorCategory(a)] -
                colorOrder[getColorCategory(b)] ||
              a.name.localeCompare(b.name)
            );

          case "type":
            return (
              a.typeLine.localeCompare(b.typeLine) ||
              a.name.localeCompare(b.name)
            );

          case "set":
            return (
              getFirstSetIndex(a) -
                getFirstSetIndex(b) ||
              a.name.localeCompare(b.name)
            );

          default:
            return a.name.localeCompare(b.name);
        }
      });
    }

    function getFirstSetIndex(card) {
      let smallest = 999;

      LEGAL_SETS.forEach(([code], index) => {
        if (card.setCodes.has(code) && index < smallest) {
          smallest = index;
        }
      });

      return smallest;
    }

    function renderResults() {
      resultCountEl.textContent = filteredCards.length.toLocaleString();

      const cardsToShow = filteredCards.slice(0, visibleCount);

      if (!cardsToShow.length) {
        resultsEl.innerHTML = `
          <div class="pm-empty">
            No cards match those filters.
          </div>
        `;

        loadMoreButton.style.display = "none";
        return;
      }

      resultsEl.innerHTML = cardsToShow
        .map(card => createCardHTML(card))
        .join("");

      loadMoreButton.style.display =
        filteredCards.length > visibleCount
          ? "block"
          : "none";
    }

    function createCardHTML(card) {
      const color = getColorCategory(card);

      const sets = getOrderedSetNames(card)
        .slice(0, 3)
        .join(", ");

      const imageHTML = card.image
        ? `
          <img
            class="pm-card-image"
            src="${card.image}"
            loading="lazy"
            alt="${escapeHTML(card.name)}"
          >
        `
        : `<div class="pm-card-image"></div>`;

      return `
        <article
          class="pm-card"
          data-color="${color}"
        >
          <a
            class="pm-card-link"
            href="${card.scryfallURI}"
            target="_blank"
            rel="noopener"
          >
            ${imageHTML}

            <div class="pm-card-info">
              <div class="pm-card-name">
                ${escapeHTML(card.name)}
              </div>

              <div class="pm-card-type">
                ${escapeHTML(card.typeLine)}
              </div>

              <div class="pm-card-meta">
                <span>MV ${card.manaValue}</span>
                <span>${escapeHTML(sets)}</span>
              </div>
            </div>
          </a>
        </article>
      `;
    }

    function showRandomCard() {
      if (!filteredCards.length) {
        randomArea.innerHTML = `
          <div class="pm-empty">
            No cards are available with the current filters.
          </div>
        `;

        return;
      }

      const card =
        filteredCards[
          Math.floor(Math.random() * filteredCards.length)
        ];

      const image = card.image
        ? `
          <img
            src="${card.image}"
            alt="${escapeHTML(card.name)}"
          >
        `
        : "";

      randomArea.innerHTML = `
        <div class="pm-random-title">
          ✦ YOUR RANDOM PREMODERN CARD
        </div>

        <div class="pm-random-card">
          <a
            href="${card.scryfallURI}"
            target="_blank"
            rel="noopener"
          >
            ${image}
          </a>

          <div>
            <div class="pm-random-name">
              ${escapeHTML(card.name)}
            </div>

            <div class="pm-random-type">
              ${escapeHTML(card.typeLine)}
              · Mana Value ${card.manaValue}
            </div>

            <div class="pm-random-text">
              ${escapeHTML(card.oracleText)}
            </div>
          </div>
        </div>
      `;

      randomArea.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }

    function getOrderedSetNames(card) {
      return LEGAL_SETS
        .filter(([code]) => card.setCodes.has(code))
        .map(([, name]) => name);
    }

    function resetFilters() {
      searchInput.value = "";
      rulesInput.value = "";
      colorSelect.value = "";
      typeSelect.value = "";
      setSelect.value = "";
      manaSelect.value = "";
      raritySelect.value = "";
      sortSelect.value = "name-asc";

      randomArea.innerHTML = "";

      applyFilters();
    }

    function normalizeSearch(value) {
      return String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase();
    }

    function escapeHTML(value = "") {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    [searchInput, rulesInput].forEach(input => {
      input.addEventListener("input", applyFilters);
    });

    [
      colorSelect,
      typeSelect,
      setSelect,
      manaSelect,
      raritySelect,
      sortSelect
    ].forEach(select => {
      select.addEventListener("change", applyFilters);
    });

    randomButton.addEventListener("click", showRandomCard);
    resetButton.addEventListener("click", resetFilters);

    loadMoreButton.addEventListener("click", () => {
      visibleCount += pageSize;
      renderResults();
    });

    loadPremodernCards();
  </script>
</body>
